<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Agent Mambo - wire dev</title>
<link rel="icon" href="data:,">
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#181640;font-family:"Arial Rounded MT Bold","Trebuchet MS",sans-serif}
#app{position:absolute;inset:0;overflow:hidden}
/* frame = host of the meter AND box of the grid */
#frame{--mm-gap:16px;position:absolute;left:calc(50% + 34px);top:50%;transform:translate(-50%,-50%);width:min(calc(100vw - 120px),calc((100vh - 20px)*1.2));aspect-ratio:6/5;background:#2B2A6B;border:6px solid #14102B;box-shadow:0 0 0 6px #1FB5A3;box-sizing:content-box;border-radius:6px}
#board{position:absolute;inset:0}
.cell{position:absolute;width:calc(100%/6);height:20%;left:calc(var(--c)*100%/6);top:calc(var(--r)*20%);display:flex;align-items:center;justify-content:center;box-sizing:border-box;padding:4%}
.cell svg{width:100%;height:100%}
@media (max-aspect-ratio:4/5){#frame{left:50%;top:calc(50% + 20px);width:calc(100vw - 32px)}}
@media (max-height:300px){#frame{left:50%;top:50%;width:min(calc(100vw - 40px),calc((100vh - 24px)*1.2));border-width:3px;box-shadow:0 0 0 3px #1FB5A3}}
#flash{position:absolute;inset:0;background:#FBF1D9;opacity:0;pointer-events:none;z-index:50}
#bar{position:fixed;left:0;right:0;bottom:0;z-index:100;display:flex;flex-wrap:wrap;gap:3px;padding:3px;background:rgba(0,0,0,.6);font:11px system-ui}
#bar button{font:inherit;padding:2px 6px;border-radius:4px;border:1px solid #1FB5A3;background:#14102B;color:#FFD23F}
body.nodev #bar{display:none}
</style>
</head>
<body>
<div id="app"><div id="frame"><div id="board"></div></div><div id="flash"></div></div>
<div id="bar"></div>
<script type="module">
import { ensureSprite, symbolMarkup, SYMBOLS } from './src/render/symbols.js';
import { createWire } from './src/render/wire.js';
import { createMeter } from './src/render/meter.js';
const q = new URLSearchParams(location.search);
if (q.get('nodev')) document.body.classList.add('nodev');
ensureSprite();
const app = document.getElementById('app'), frame = document.getElementById('frame'), board = document.getElementById('board');
const COLS = 6, ROWS = 5, grid = [];
const NAMES = ['H1','H2','H3','H4','L1','L2','L3','L4','W','S'];
const layout = [
 ['H1','L2','L1','H3','L4','H2'],['L3','H4','S','L1','H1','L2'],['L4','H2','L3','H3','S','L1'],['H1','L1','H4','L2','L4','H3'],['L2','H3','L1','H2','L3','H4']]; // [row][col]
function fill(c, r) {
  const e = document.createElement('div'); e.className = 'cell'; e.style.setProperty('--c', c); e.style.setProperty('--r', r);
  e.innerHTML = symbolMarkup(layout[r][c]); board.appendChild(e); (grid[c] = grid[c] || [])[r] = { el: e, name: layout[r][c] };
}
function fillAll() { board.querySelectorAll('.cell').forEach((e) => e.remove()); for (let c = 0; c < COLS; c++) for (let r = 0; r < ROWS; r++) fill(c, r); }
fillAll();
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const shake = (amp, ms) => { try { frame.animate([{ transform: 'translate(-50%,-50%)' }, { transform: `translate(calc(-50% + ${amp * 4}px),calc(-50% + ${amp * 2}px))` }, { transform: `translate(calc(-50% - ${amp * 4}px),-50%)` }, { transform: 'translate(-50%,-50%)' }], { duration: ms, easing: 'steps(6,end)' }); } catch (e) {} };
const flash = (peak, ms, col) => { const f = document.getElementById('flash'); f.style.background = col || '#fff'; f.animate([{ opacity: 0 }, { opacity: peak }, { opacity: 0 }], { duration: ms }); };
const poses = []; window.__poses = poses;
const sounds = []; window.__sounds = sounds;
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
let turbo = !!q.get('turbo');
const ctx = {
  board, reduced, turbo: () => turbo, sleep: (ms) => sleep(turbo ? ms * .42 : ms), shake, flash,
  audio: { play: (n) => { sounds.push(n); } },
  pose: (n) => { poses.push(n); },
  t: (k) => ({ 'fx.wire': 'WIRE!', 'fx.defuse': 'DEFUSE!', 'fx.pow': 'POW!', 'fx.bam': 'BAM!', 'fx.boom': 'BOOM!', 'meter.kept': 'KEPT' }[k] || k),
  cellCenter(c, r) { const a = app.getBoundingClientRect(), b = board.getBoundingClientRect(); return { x: b.left - a.left + (c + .5) * b.width / COLS, y: b.top - a.top + (r + .5) * b.height / ROWS, size: b.width / COLS }; },
  cellEl: (c, r) => grid[c][r].el,
  emptyCell: (c, r) => { grid[c][r].el.style.visibility = 'hidden'; grid[c][r].empty = true; },
};
const wire = createWire(ctx);
const meter = createMeter(frame, ctx);
meter.show(true);
const PATH = [[0,0],[1,0],[1,1],[2,1],[3,1],[3,2],[4,2],[5,2]].map(([reel, row]) => ({ reel, row }));  // (1,... ) has S at (2,1)? see layout
window.__dev = { wire, meter, ctx, fillAll, PATH, grid, setTurbo: (b) => { turbo = b; } };
const acts = {
  reset() { wire.clear(); fillAll(); meter.reset(); },
  path() { return wire.path({ cells: PATH, burned: 1 }); },
  burn1() { return wire.burn({ burned: 1, newCells: [PATH[0]] }); },
  burn3() { return wire.burn({ burned: 3 }); },
  burn6() { return wire.burn({ burned: 6 }); },
  burn8() { return wire.burn({ burned: 8 }); },
  blast() { return wire.blast({ cells: PATH.slice(0, 6).filter((p) => !(p.reel === 2 && p.row === 1)) }); },
  fizzle() { return wire.fizzle({ burned: 2 }); },
  mplus() { meter.set(meter.value + 1, { animate: true, from: { x: 300, y: 200 } }); },
  m5() { meter.set(5, { animate: true }); }, m12() { meter.set(12, { animate: true }); }, m25() { meter.set(25); }, m60() { meter.set(60); },
  max() { meter.max(); }, kept() { meter.pulse(); },
};
window.__acts = acts;
const bar = document.getElementById('bar');
Object.keys(acts).forEach((k) => { const b = document.createElement('button'); b.textContent = k; b.onclick = () => acts[k](); bar.appendChild(b); });
</script>
</body>
</html>
