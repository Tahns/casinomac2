<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#181640">
<title>Agent Mambo</title>
<style id="mascot-slot-base">:where(#mascot-slot){position:absolute;pointer-events:none;z-index:2;left:0;bottom:0;width:var(--side,120px);aspect-ratio:1;max-height:28%}:where(#mascot-slot) *{pointer-events:none!important}</style>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="src/render/mascot.css">
<link rel="stylesheet" href="src/render/wire.css">
<link rel="stylesheet" href="src/render/meter.css">
<!-- v2 stylesheets (empty in step 0; each is owned by one work package, see docs/v2/INTERFACES.md) -->
<link rel="stylesheet" href="src/ui/ui.css">
<link rel="stylesheet" href="src/render/heroine/heroine.css">
<link rel="stylesheet" href="src/render/layers/layers.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 2l3 5 5-3 0 6 6 1-4 5 4 5-6 1 0 6-5-3-3 5-3-5-5 3 0-6-6-1 4-5-4-5 6-1 0-6 5 3z' fill='%23FFD23F' stroke='%2314102B' stroke-width='1.6' stroke-linejoin='round'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%23F0472F' stroke='%2314102B' stroke-width='1.6'/%3E%3C/svg%3E">
</head>
<body class="state-booting">
<div id="app">
  <div id="scene" aria-hidden="true"></div>

  <header id="logo-area">
    <h1 id="logo" class="logo" data-i18n-aria-label="game.title"><span class="sr-only" data-i18n="game.title">Agent Mambo</span></h1>
  </header>

  <div id="mascot-slot" aria-hidden="true"></div>
  <!-- v2: the heroine box, LEFT of the grid (WP3 draws into it, WP1 lays it out and removes [hidden]). Hidden placeholder in step 0: v1 keeps #mascot-slot. -->
  <div id="heroine-slot" aria-hidden="true" hidden></div>

  <main id="game" class="game-surface" aria-live="off"></main>

  <!-- Mission Meter host: styles.css makes it exactly the board frame box; meter.js hangs the ladder / strip / badge off it -->
  <div id="meter-slot"></div>

  <section id="hud-info" class="hud-info" aria-label="Status">
    <div class="stat hud-bal"><span class="lbl" data-i18n="label.balance">BALANCE</span><b id="balance" class="val">0.00</b></div>
    <div class="stat hud-bet">
      <span class="lbl" data-i18n="label.bet">BET</span>
      <div class="betrow bet-controls">
        <button id="btn-bet-minus" class="mini only-play" type="button" data-i18n-title="btn.betMinus"><svg viewBox="0 0 24 24"><path d="M5 12h14" /></svg></button>
        <b id="bet" class="val">0.00</b>
        <button id="btn-bet-plus" class="mini only-play" type="button" data-i18n-title="btn.betPlus"><svg viewBox="0 0 24 24"><path d="M5 12h14M12 5v14" /></svg></button>
      </div>
    </div>
    <div class="stat hud-win"><span class="lbl" data-i18n="label.win">WIN</span><b id="win" class="val">0.00</b></div>
    <div id="freespin-box" class="stat fsbox"><span class="lbl" data-i18n="label.freeSpins">FREE SPINS</span><b id="freespin-counter" class="val"></b></div>
  </section>

  <nav id="hud-ctrl" class="hud-ctrl" aria-label="Controls">
    <button id="btn-bet" class="spin only-play" type="button" data-i18n-title="btn.spin">
      <svg viewBox="0 0 48 48" aria-hidden="true"><path class="arr" d="M34 14a14 14 0 1 0 4 11" /><path class="head" d="M36 5v12H24z" /></svg>
      <span class="spin-lbl" data-i18n="btn.spin">SPIN</span>
    </button>
    <button id="btn-unleash" class="unleash only-play" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 21V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v17M4 21h16" /><circle class="f" cx="14.6" cy="12.5" r="1.1" /><path d="M9 7h6" /></svg>
      <span class="u-txt"><span data-i18n="btn.unleash">SECRET ENTRANCE</span><small id="unleash-cost"></small></span>
    </button>
    <button id="btn-autoplay" class="tbtn only-play" type="button" data-i18n-title="btn.autoplay" aria-pressed="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 0 1 14-5.3M20 12a8 8 0 0 1-14 5.3" /><path class="f" d="M19 2v6h-6zM5 22v-6h6z" /></svg>
      <span id="autoplay-left" class="badge"></span>
    </button>
    <button id="btn-turbo" class="tbtn only-play" type="button" data-i18n-title="btn.turbo" aria-pressed="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path class="f" d="M13 2L5 14h6l-1 8 8-12h-6z" /></svg>
    </button>
    <button id="btn-menu" class="tbtn" type="button" data-i18n-title="btn.menu" aria-expanded="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" /></svg>
    </button>
    <div class="tools">
      <button id="btn-sound" class="tbtn" type="button" data-i18n-title="btn.sound" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path class="f" d="M4 9h4l5-4v14l-5-4H4z" /><path class="waves" d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11" /><path class="x" d="M16 9l5 6M21 9l-5 6" /></svg>
      </button>
      <!-- v2: settings gear (WP1 wires it to #modal-settings and removes [hidden]; hidden in step 0 so v1 shows no dead button) -->
      <button id="btn-settings" class="tbtn" type="button" hidden aria-haspopup="dialog" data-i18n-title="btn.settings">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.1" /><circle cx="12" cy="12" r="6.4" /><path d="M12 2.8v2.4M12 18.8v2.4M2.8 12h2.4M18.8 12h2.4M5.5 5.5l1.7 1.7M16.8 16.8l1.7 1.7M18.5 5.5l-1.7 1.7M7.2 16.8l-1.7 1.7" /></svg>
      </button>
      <button id="btn-info" class="tbtn" type="button" data-i18n-title="btn.info">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" /><path d="M12 11v6" /><circle class="f" cx="12" cy="7.5" r="1.2" /></svg>
      </button>
      <button id="btn-fullscreen" class="tbtn" type="button" data-i18n-title="btn.fullscreen">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" /></svg>
      </button>
    </div>
  </nav>

  <div id="replay-bar" hidden><div id="replay-info"></div></div>

  <!-- Modals: CORE toggles [hidden] + .open -->
  <div id="modal-autoplay" class="modal" hidden role="dialog" aria-modal="true" aria-labelledby="ap-title">
    <div class="modal-box">
      <h2 id="ap-title" data-i18n="autoplay.title">AUTOPLAY</h2>
      <label class="fld"><span data-i18n="autoplay.spins">Number of spins</span>
        <select id="ap-count"><option>10</option><option>25</option><option>50</option><option>75</option><option>100</option><option>250</option><option>500</option></select></label>
      <label class="chk"><input type="checkbox" id="ap-stop-bigwin" checked><i></i><span data-i18n="autoplay.stopBigWin">Stop on a big win</span></label>
      <label class="chk"><input type="checkbox" id="ap-stop-feature" checked><i></i><span data-i18n="autoplay.stopFeature">Stop when free spins start</span></label>
      <label class="fld"><span data-i18n="autoplay.stopBelow">Stop if balance falls below</span>
        <input type="number" id="ap-stop-below" min="0" step="1" value="0" inputmode="decimal"></label>
      <div class="modal-actions">
        <button id="ap-cancel" class="mbtn ghost" type="button" data-i18n="btn.cancel">CANCEL</button>
        <button id="ap-confirm" class="mbtn" type="button" data-i18n="autoplay.start">START AUTOPLAY</button>
      </div>
    </div>
  </div>
  <div id="modal-confirm" class="modal" hidden role="dialog" aria-modal="true" aria-labelledby="confirm-title">
    <div class="modal-box">
      <h2 id="confirm-title" data-i18n="unleash.title">SECRET ENTRANCE</h2>
      <p id="confirm-text"></p>
      <div class="modal-actions">
        <button id="confirm-cancel" class="mbtn ghost" type="button" data-i18n="btn.cancel">CANCEL</button>
        <button id="confirm-ok" class="mbtn" type="button" data-i18n="btn.confirm">CONFIRM</button>
      </div>
    </div>
  </div>
  <div id="modal-message" class="modal" hidden role="alertdialog" aria-modal="true">
    <div class="modal-box">
      <p id="message-text"></p>
      <div class="modal-actions"><button id="message-ok" class="mbtn" type="button" data-i18n="btn.ok">OK</button></div>
    </div>
  </div>
  <div id="modal-info" class="modal modal-wide" hidden role="dialog" aria-modal="true"></div>
  <!-- v2: settings dialog shell (WP1 fills it: 4 tabs Sound / Display / Play / Info, see SYNTHESIS 6) -->
  <div id="modal-settings" class="modal" hidden role="dialog" aria-modal="true" data-i18n-aria-label="btn.settings"><div class="modal-box"></div></div>

  <div id="loading" role="status">
    <style id="mb-ld-css">
      #loading{background:#181640;overflow:hidden}
      #loading::before{content:"";position:absolute;inset:0;background:radial-gradient(rgba(251,241,217,.1) 1.6px,transparent 2.2px) 0 0/12px 12px}
      #loading .mb-ld-in{position:relative;display:flex;flex-direction:row;align-items:center;justify-content:center;gap:clamp(6px,3vmin,28px);padding:0 16px;max-width:100%}
      #loading .mb-ld-mascot{flex:0 0 auto;display:grid;place-items:center;min-width:clamp(60px,26vmin,200px)}
      #loading .mb-ld-main{display:flex;flex-direction:column;align-items:center;gap:clamp(4px,1.8vmin,14px);min-width:0}
      #loading #mb-ld-logo{width:clamp(150px,56vmin,330px);line-height:0}
      #loading #mb-ld-logo svg{width:100%;height:auto;display:block;overflow:visible}
      #loading .mb-ld-wire{width:clamp(150px,56vmin,330px);line-height:0}
      #loading .mb-ld-wire svg{width:100%;height:auto;display:block;overflow:visible}
      #loading .mb-ld-text{font-family:"Futura","Century Gothic","Arial Black",sans-serif;font-weight:800;font-size:clamp(10px,2.6vmin,16px);letter-spacing:.14em;text-transform:uppercase;color:#FBF1D9;text-align:center;text-shadow:1px 2px 0 #14102B}
      #loading .mb-burn{stroke-dasharray:100;stroke-dashoffset:100;animation:mbburn 3.6s steps(8,end) infinite}
      #loading .mb-spark{animation:mbspark 3.6s steps(8,end) infinite}
      #loading .mb-n{fill:#3C3A86;animation-duration:3.6s;animation-iteration-count:infinite;animation-timing-function:steps(1,end)}
      #loading .mb-n:nth-of-type(1){animation-name:mbn1}#loading .mb-n:nth-of-type(2){animation-name:mbn2}#loading .mb-n:nth-of-type(3){animation-name:mbn3}#loading .mb-n:nth-of-type(4){animation-name:mbn4}
      #loading .mb-n:nth-of-type(5){animation-name:mbn5}#loading .mb-n:nth-of-type(6){animation-name:mbn6}#loading .mb-n:nth-of-type(7){animation-name:mbn7}#loading .mb-n:nth-of-type(8){animation-name:mbn8}
      #loading .mb-hand{transform-origin:0 0;animation:mbtick 3.6s steps(8,end) infinite}
      @keyframes mbburn{0%{stroke-dashoffset:100}88.89%{stroke-dashoffset:0}100%{stroke-dashoffset:0}}
      @keyframes mbspark{0%{transform:translateX(0);opacity:1}88.89%{transform:translateX(276px);opacity:1}94%{transform:translateX(276px);opacity:0}100%{transform:translateX(0);opacity:0}}
      @keyframes mbtick{0%{transform:rotate(0)}88.89%{transform:rotate(300deg)}100%{transform:rotate(300deg)}}
      @keyframes mbn1{0%{fill:#3C3A86}11.11%{fill:#F0472F}97%{fill:#F0472F}97.1%{fill:#3C3A86}}
      @keyframes mbn2{0%{fill:#3C3A86}22.22%{fill:#F0472F}97%{fill:#F0472F}97.1%{fill:#3C3A86}}
      @keyframes mbn3{0%{fill:#3C3A86}33.33%{fill:#F0472F}97%{fill:#F0472F}97.1%{fill:#3C3A86}}
      @keyframes mbn4{0%{fill:#3C3A86}44.44%{fill:#F0472F}97%{fill:#F0472F}97.1%{fill:#3C3A86}}
      @keyframes mbn5{0%{fill:#3C3A86}55.56%{fill:#F0472F}97%{fill:#F0472F}97.1%{fill:#3C3A86}}
      @keyframes mbn6{0%{fill:#3C3A86}66.67%{fill:#F0472F}97%{fill:#F0472F}97.1%{fill:#3C3A86}}
      @keyframes mbn7{0%{fill:#3C3A86}77.78%{fill:#F0472F}97%{fill:#F0472F}97.1%{fill:#3C3A86}}
      @keyframes mbn8{0%{fill:#3C3A86}88.89%{fill:#F0472F}97%{fill:#F0472F}97.1%{fill:#3C3A86}}
      @media (max-aspect-ratio:1/1){#loading .mb-ld-in{flex-direction:column}#loading .mb-ld-mascot{order:2;min-width:0}#loading .mb-ld-main{order:1}}
      @media (max-height:260px){#loading .mb-ld-mascot{min-width:clamp(50px,24vmin,90px)}#loading #mb-ld-logo,#loading .mb-ld-wire{width:clamp(130px,52vmin,200px)}}
      @media (prefers-reduced-motion:reduce){#loading .mb-burn{animation:none;stroke-dashoffset:50}#loading .mb-spark,#loading .mb-hand,#loading .mb-n{animation:none}}
    </style>
    <div class="mb-ld-in">
      <div class="mb-ld-mascot" id="mb-ld-mascot" aria-hidden="true"></div>
      <div class="mb-ld-main">
        <div id="mb-ld-logo" aria-hidden="true"></div>
        <div class="mb-ld-wire" aria-hidden="true">
          <svg viewBox="0 0 330 46" focusable="false">
            <path d="M14 23q34.5-8 69 0t69 0t69 0t69 0" fill="none" stroke="#14102B" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M14 23q34.5-8 69 0t69 0t69 0t69 0" fill="none" stroke="#2B2A6B" stroke-width="8.5" stroke-linecap="round"/>
            <path d="M14 23q34.5-8 69 0t69 0t69 0t69 0" fill="none" stroke="#9A7BD0" stroke-width="2" stroke-dasharray="4 4"/>
            <path class="mb-burn" pathLength="100" d="M14 23q34.5-8 69 0t69 0t69 0t69 0" fill="none" stroke="#FBF1D9" stroke-width="6.5" stroke-linecap="butt"/>
            <path class="mb-burn" pathLength="100" d="M14 23q34.5-8 69 0t69 0t69 0t69 0" fill="none" stroke="#FFD23F" stroke-width="2.4" stroke-linecap="butt"/>
            <g stroke="#14102B" stroke-width="2.6">
              <circle class="mb-n" cx="36" cy="19.5" r="5.6"/><circle class="mb-n" cx="70.5" cy="20.6" r="5.6"/><circle class="mb-n" cx="105" cy="26.5" r="5.6"/><circle class="mb-n" cx="139.5" cy="25.4" r="5.6"/>
              <circle class="mb-n" cx="174" cy="19.5" r="5.6"/><circle class="mb-n" cx="208.5" cy="20.6" r="5.6"/><circle class="mb-n" cx="243" cy="26.5" r="5.6"/><circle class="mb-n" cx="277.5" cy="25.4" r="5.6"/>
            </g>
            <g class="mb-spark"><g transform="translate(14 23)"><path d="M0-10L3-3L10 0L3 3L0 10L-3 3L-10 0L-3-3Z" fill="#FFD23F" stroke="#14102B" stroke-width="2" stroke-linejoin="round"/></g></g>
            <g transform="translate(308 23)"><circle cx="-8" cy="-12" r="4.4" fill="#F0472F" stroke="#14102B" stroke-width="2.4"/><circle cx="8" cy="-12" r="4.4" fill="#F0472F" stroke="#14102B" stroke-width="2.4"/><circle r="15" fill="#FBF1D9" stroke="#14102B" stroke-width="3.6"/><circle r="11.5" fill="none" stroke="#F0472F" stroke-width="1.6"/><path d="M0-9V0" stroke="#14102B" stroke-width="2.6" stroke-linecap="round"/><g class="mb-hand"><path d="M0 0V-8" stroke="#14102B" stroke-width="2.6" stroke-linecap="round"/></g><circle r="2" fill="#14102B"/></g>
          </svg>
        </div>
        <div class="mb-ld-text" data-i18n="loading.text">Preparing the mission...</div>
      </div>
    </div>
  </div>
<noscript><p style="color:#fff;padding:1em">JavaScript is required.</p></noscript>
<script type="module">
  // The renderer is created by src/main.js (CORE); this tiny boot only prepares static visuals so the loading screen can leave.
  import { prepareStatic } from './src/render/index.js';
  try { prepareStatic(document.getElementById('app')); } catch (e) { console.error(e); }
</script>
<script type="module" src="src/main.js"></script>
</body>
</html>
