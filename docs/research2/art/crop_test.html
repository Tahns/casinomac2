<!doctype html><html><head><meta charset="utf-8"><title>Mambo crop test</title><link rel="icon" href="data:,">
<style>html,body{margin:0;background:#E8B83A}#g{display:flex;flex-wrap:wrap;gap:8px;padding:8px;align-items:flex-end}.c{background:#d9a72a;position:relative;overflow:hidden;flex:none}.c i{position:absolute;left:2px;top:0;font:9px Arial;color:#2B1A12}</style></head><body><div id="g"></div>
<script type="module">
// Dev page (not shipped): the waist-up crop at real phone sizes. window.build("crop=bust&outfit=...&poses=idle,smallwin&w=120&scale=1")
import { createHeroine } from './mambo_rig.mjs';
window.build = (query, w, h) => {
  const q = new URLSearchParams(query), g = document.getElementById('g');
  const poses = (q.get('poses') || 'idle').split(','), outfits = (q.get('outfits') || q.get('outfit') || 'inspectrice').split(',');
  for (const o of outfits) for (const p of poses) {
    const d = document.createElement('div'); d.className = 'c'; d.style.cssText = `width:${w}px;height:${h}px`; d.innerHTML = `<i>${o} ${p}</i>`;
    const inner = document.createElement('div'); inner.style.cssText = 'position:absolute;inset:0'; d.appendChild(inner); g.appendChild(d);
    const hh = createHeroine(inner, { outfit: o, raf: false, idle: false, limited: 0, crop: q.get('crop') || 'bust', mirror: q.get('mirror') === '1' });
    hh.setPose(p, { snap: true }); if (q.get('mood')) hh.setMood(q.get('mood')); hh.snap(); for (let i = 0; i < 20; i++) hh.step(1 / 60);
  }
};
</script></body></html>
