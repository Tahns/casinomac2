<!doctype html><meta charset=utf-8><body style="margin:0;background:#E9D6A6">
<div id=g style="display:grid;grid-template-columns:repeat(5,200px);gap:10px;padding:10px"></div>
<div id=g2 style="display:flex;gap:6px;padding:10px;background:#4a2a3c"></div>
<style>.sym-svg{width:100%;height:100%;overflow:visible}</style>
<script type=module>
import {ensureSprite,symbolMarkup,SYMBOLS} from './src/render/symbols.js';
ensureSprite();
g.innerHTML=SYMBOLS.map(s=>`<div style="width:200px;height:200px">${symbolMarkup(s)}</div>`).join('');
g2.innerHTML=SYMBOLS.map(s=>`<div style="width:40px;height:40px">${symbolMarkup(s)}</div>`).join('');
</script>
