<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mambo - mascot dev</title>
<link rel="stylesheet" href="src/render/mascot.css">
<style>
 body{margin:0;background:#181640;color:#FBF1D9;font:14px system-ui,sans-serif;padding:16px}
 h1{margin:0 0 10px;font-size:18px}
 .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:14px}
 .cell{background:#2B2A6B;color:#FBF1D9;border:3px solid #14102B;border-radius:10px;padding:8px;text-align:center;position:relative}
 .cell h2{margin:0 0 4px;font:700 13px system-ui}
 .stage{display:flex;align-items:flex-end;justify-content:center;gap:10px;min-height:150px;padding-top:44px}
 .frame{width:400px;height:225px;background:#2B2A6B;border:3px solid #14102B;position:relative;margin:14px 0;overflow:visible}
 .frame .host{position:absolute;right:8px;bottom:6px}
 .sec{margin:18px 0 6px;font-weight:700}
 .btns button{margin:2px;padding:4px 8px}
 body.solo .grid,body.solo .sec,body.solo h1,body.solo .btns,body.solo .frame{display:none}
 #solo{display:none}body.solo #solo{display:flex;align-items:flex-end;gap:30px;padding:60px 40px}
 body.still .gus *{animation:none!important;transition:none!important}
</style></head><body>
<h1>Agent Mambo - all poses</h1>
<div class="btns" id="btns"></div>
<div class="grid" id="grid"></div>
<div class="sec">400x225 frame, small variant (90px)</div>
<div class="frame" id="frame"><div class="host" id="fh"></div></div>
<div id="solo"></div>
<script type="module">
import { createMascot, POSES } from './src/render/mascot.js';
const q = new URLSearchParams(location.search);
if (q.get('still')) document.body.classList.add('still');
const grid = document.getElementById('grid');
const all = [];
if (q.get('pose')) {
  document.body.classList.add('solo');
  const solo = document.getElementById('solo');
  const sz = +(q.get('size') || 360);
  const m = createMascot(solo, { size: sz, pose: q.get('pose'), bubble: 'right' });
  if (q.get('say')) m.say(q.get('say'), 0);
  window.__m = m;
} else {
  for (const p of POSES) {
    const c = document.createElement('div'); c.className = 'cell'; c.id = 'cell-' + p;
    c.innerHTML = `<h2>${p}</h2><div class="stage"></div>`;
    grid.appendChild(c);
    const st = c.querySelector('.stage');
    all.push(createMascot(st, { size: 120, pose: p }), createMascot(st, { size: 240, pose: p }));
  }
  const fm = createMascot(document.getElementById('fh'), { size: 90, pose: 'idle' });
  const b = document.getElementById('btns');
  for (const p of POSES) { const x = document.createElement('button'); x.textContent = p; x.onclick = () => fm.setPose(p); b.appendChild(x); }
  const s = document.createElement('button'); s.textContent = 'say'; s.onclick = () => fm.say('BIG WIN!', 1800); b.appendChild(s);
  window.__fm = fm;
}
</script></body></html>
